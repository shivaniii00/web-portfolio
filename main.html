<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shivani's VFX Scene</title>
  <link rel="stylesheet" href="/style.css" />

  <!-- ✅ Import Map (Make sure JSON is formatted correctly) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/EffectComposer.js",
        "three/examples/jsm/postprocessing/RenderPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/RenderPass.js",
        "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/UnrealBloomPass.js",
        "three/examples/jsm/objects/Reflector.js": "https://unpkg.com/three@0.128.0/examples/jsm/objects/Reflector.js",
        "three/examples/jsm/postprocessing/ShaderPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/ShaderPass.js"
      }
    }
  </script>
  <div id="loading-screen">
    <div id="progress-bar-container">
      <div id="progress-bar"></div>
      <p id="progress-text">Loading... 0%</p>
    </div>
  </div>

</head>
<body>
  <canvas id="three-canvas"></canvas>

  <div id="video-popup">
    <video id="video-player" controls>
      <source id="video-source" src="" type="video/mp4" />
    </video>
    <button id="close-popup">✖</button>
  </div>

  <div id="resume-popup">
    <iframe id="resume-viewer" src="Shivani_Resume_2025.pdf"></iframe>
    <button id="close-resume-popup">✖</button>
  </div>

  <div id="image-overlay" class="overlay">
    <img id="overlay-image" src="" alt="Overlay Image">
    <button id="close-overlay">X</button>
  </div>

<!-- 📸 Photography Gallery Overlay -->
<div id="photo-gallery" class="pg-overlay" aria-hidden="true">
  <!-- Grid (always visible while gallery is open) -->
  <div class="pg-gridView" role="dialog" aria-modal="true" aria-label="Photography Gallery">
    <button id="pg-closeGrid" class="pg-closeGrid" aria-label="Close gallery grid">×</button>
    <h2 class="pg-title">Photography</h2>
    <div id="pg-grid" class="pg-grid" aria-live="polite"></div>
  </div>

  <!-- Lightbox overlay (sits above grid) -->
  <div class="pg-lightbox" id="pg-lightbox" aria-hidden="true">
    <div class="pg-lightbox-scrim"></div>
    <div class="pg-lightbox-inner">
      <button id="pg-backToGrid" class="pg-backToGrid" aria-label="Back to grid">←</button>
      <button id="pg-prev" class="pg-prev" aria-label="Previous photo">❮</button>
      <img id="pg-lightboxImg" alt="" />
      <button id="pg-next" class="pg-next" aria-label="Next photo">❯</button>
    </div>
  </div>
</div>


  <!-- ✅ Test if Three.js loads correctly -->
  <script type="module">
    import * as THREE from "three";
    console.log("✅ Three.js loaded successfully:", THREE);
  </script>

  <!-- ✅ Fix: Load main.js AFTER import map -->
  <script type="module" src="main.js"></script>

</body>
</html>
