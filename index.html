<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Portfolio — Enter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Hint the browser about what's coming next -->
  <link rel="prefetch" href="main.html" as="document" />
  <link rel="preload" href="public/models/cyberpunk_station.glb" as="fetch" />
  <link rel="preload" href="public/sounds/ambience.wav" as="audio" />
  <link rel="preload" href="public/sounds/woosh.wav" as="audio" />
  <link rel="preload" href="public/sounds/beep.mp3" as="audio" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />

  <link rel="stylesheet" href="style.css" />
  <style>
    /* Minimal splash layout */
    body { display:grid; place-items:center; height:100vh; overflow:hidden; background:#000; color:#fff; }
    .enter-wrap { text-align:center; }
    .enter-btn {
      appearance:none; border:0; padding:14px 28px; border-radius:10px;
      background:#08f; color:#fff; font-size:18px; cursor:pointer;
      box-shadow:0 0 30px rgba(0,128,255,.4);
    }
    .enter-btn:hover { filter:brightness(1.1); }
  </style>
</head>
<body>
  <div class="enter-wrap">
    <h1>Welcome</h1>
    <p>Click to enter</p>
    <button id="enter-btn" class="enter-btn">ENTER</button>
  </div>

  <script>
    // Normal navigation is faster than fetch+swap SPA
    document.getElementById('enter-btn').addEventListener('click', () => {
      window.location.href = 'main.html';
    });
  </script>
</body>
</html>
