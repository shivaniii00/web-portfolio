<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Import Map for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <!-- Performance: warm up main.html and assets -->
  <link rel="prefetch" href="/main.html" as="document">
  <link rel="preload" href="/dist/main.css" as="style">
  <link rel="preload" href="/dist/main.bundle.js" as="script">
  <!-- Add other heavy assets here -->
  <link rel="prefetch" href="/assets/models/bus-station.glb" as="fetch" crossorigin>
  <link rel="prefetch" href="/assets/hdris/studio.hdr" as="fetch" crossorigin>

  <!-- Chrome speculation rules: allow prerender -->
  <script type="speculationrules">
  {
    "prefetch": [{ "source": "list", "urls": ["/main.html"] }],
    "prerender": [{ "source": "list", "urls": ["/main.html"] }]
  }
  </script>

  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      transition: opacity 0.6s ease; /* fade during swap */
    }
    
    #enter-button {
      font-size: 2rem;
      padding: 20px 40px;
      border: 2px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #enter-button:hover {
      background: white;
      color: black;
    }

    #fade-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease-in-out;
    }
  </style>
</head>
<body>

  <button id="enter-button">ENTER</button>
  <div id="fade-overlay"></div>

  <script>
    document.getElementById("enter-button").addEventListener("click", async function(e) {
      e.preventDefault();
      const overlay = document.getElementById("fade-overlay");
      overlay.style.visibility = "visible";
      overlay.style.opacity = "1";

      // after fade, swap in main.html without full reload
      setTimeout(async () => {
        try {
          const html = await (await fetch("/main.html", { credentials: "include" })).text();
          history.pushState(null, "", "/main.html");
          document.open(); document.write(html); document.close();
        } catch (err) {
          // fallback if fetch fails
          window.location.href = "main.html";
        }
      }, 800); // slightly less than overlay duration
    });
  </script>

</body>
</html>
